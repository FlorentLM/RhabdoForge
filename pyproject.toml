[project]
name = "InsectVisionSimulator"
version = "0.9.5"
description = "A fast and insect vision simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "glfw>=2.9.0",
    "matplotlib>=3.10.3",
    "moderngl>=5.12.0",
    "numpy==2.2",
    "pillow>=11.3.0",
    "pyopengl>=3.1.9",
    "scipy>=1.16.0",
    "open3d",
    "pyvista",
    "pyglm"
]